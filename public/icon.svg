<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Calculator Body Shell -->
  <rect x="80" y="70" width="352" height="372" rx="48" fill="#0b0f17" fill-opacity="0.85" stroke="url(#glow)" stroke-width="4" filter="url(#shadow)" />
  
  <!-- Digital Display Panel -->
  <rect x="110" y="105" width="292" height="82" rx="20" fill="#131b2e" stroke="#334155" stroke-width="2" />
  <circle cx="132" cy="146" r="6" fill="#10b981" />
  <text x="375" y="157" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="34" fill="#38bdf8" text-anchor="end">888.42</text>
  
  <!-- Keypad Grid -->
  <!-- Row 1 -->
  <rect x="110" y="210" width="58" height="48" rx="14" fill="#1e293b" />
  <text x="139" y="242" font-family="system-ui" font-weight="600" font-size="20" fill="#94a3b8" text-anchor="middle">C</text>
  
  <rect x="188" y="210" width="58" height="48" rx="14" fill="#1e293b" />
  <text x="217" y="242" font-family="system-ui" font-weight="600" font-size="20" fill="#94a3b8" text-anchor="middle">±</text>
  
  <rect x="266" y="210" width="58" height="48" rx="14" fill="#1e293b" />
  <text x="295" y="242" font-family="system-ui" font-weight="600" font-size="20" fill="#94a3b8" text-anchor="middle">%</text>
  
  <rect x="344" y="210" width="58" height="48" rx="14" fill="#4f46e5" />
  <text x="373" y="242" font-family="system-ui" font-weight="700" font-size="22" fill="#ffffff" text-anchor="middle">÷</text>
  
  <!-- Row 2 -->
  <rect x="110" y="270" width="58" height="48" rx="14" fill="#1e293b" />
  <text x="139" y="302" font-family="system-ui" font-weight="600" font-size="20" fill="#f8fafc" text-anchor="middle">7</text>
  
  <rect x="188" y="270" width="58" height="48" rx="14" fill="#1e293b" />
  <text x="217" y="302" font-family="system-ui" font-weight="600" font-size="20" fill="#f8fafc" text-anchor="middle">8</text>
  
  <rect x="266" y="270" width="58" height="48" rx="14" fill="#1e293b" />
  <text x="295" y="302" font-family="system-ui" font-weight="600" font-size="20" fill="#f8fafc" text-anchor="middle">9</text>
  
  <rect x="344" y="270" width="58" height="48" rx="14" fill="#4f46e5" />
  <text x="373" y="302" font-family="system-ui" font-weight="700" font-size="22" fill="#ffffff" text-anchor="middle">×</text>
  
  <!-- Row 3 -->
  <rect x="110" y="330" width="58" height="48" rx="14" fill="#1e293b" />
  <text x="139" y="362" font-family="system-ui" font-weight="600" font-size="20" fill="#f8fafc" text-anchor="middle">4</text>
  
  <rect x="188" y="330" width="58" height="48" rx="14" fill="#1e293b" />
  <text x="217" y="362" font-family="system-ui" font-weight="600" font-size="20" fill="#f8fafc" text-anchor="middle">5</text>
  
  <rect x="266" y="330" width="58" height="48" rx="14" fill="#1e293b" />
  <text x="295" y="362" font-family="system-ui" font-weight="600" font-size="20" fill="#f8fafc" text-anchor="middle">6</text>
  
  <rect x="344" y="330" width="58" height="48" rx="14" fill="#0284c7" />
  <text x="373" y="362" font-family="system-ui" font-weight="700" font-size="22" fill="#ffffff" text-anchor="middle">-</text>
  
  <!-- Row 4 -->
  <rect x="110" y="390" width="136" height="38" rx="14" fill="#1e293b" />
  <text x="178" y="416" font-family="system-ui" font-weight="600" font-size="20" fill="#f8fafc" text-anchor="middle">0</text>
  
  <rect x="266" y="390" width="58" height="38" rx="14" fill="#1e293b" />
  <text x="295" y="416" font-family="system-ui" font-weight="600" font-size="20" fill="#f8fafc" text-anchor="middle">.</text>
  
  <rect x="344" y="390" width="58" height="38" rx="14" fill="url(#glow)" />
  <text x="373" y="416" font-family="system-ui" font-weight="700" font-size="22" fill="#0b0f17" text-anchor="middle">=</text>
  
  <!-- AI Sparkle Orb (floating badge) -->
  <circle cx="410" cy="95" r="32" fill="#0284c7" filter="url(#shadow)" />
  <path d="M410 75 L414 89 L428 95 L414 101 L410 115 L406 101 L392 95 L406 89 Z" fill="#ffffff" />
</svg>
